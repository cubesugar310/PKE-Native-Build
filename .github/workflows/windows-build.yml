name: Build PKE Native Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct readable native source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          chunks = sorted(Path('source-bundles').glob('bundle*.part*.txt'))
          if not chunks:
              raise SystemExit('No readable source bundle chunks found')
          bundle = ''.join(p.read_text(encoding='utf-8') for p in chunks)
          pattern = re.compile(r'^=== FILE: (.+?) ===\n(.*?)^=== END FILE ===\n?', re.M | re.S)
          matches = list(pattern.finditer(bundle))
          if len(matches) != 32:
              raise SystemExit(f'Expected 32 source files, reconstructed {len(matches)}')
          for m in matches:
              rel = m.group(1)
              if not rel.startswith('native/') or '..' in Path(rel).parts:
                  raise SystemExit(f'Unsafe source path: {rel}')
              out = Path(rel)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(m.group(2), encoding='utf-8', newline='')
              print(f'wrote {rel}: {out.stat().st_size} bytes')
          Path('native/README.md').write_text(
              'PKE Native Prototype 0.1\n\nWindows x64 native prototype.\n'
              'Configure pke-native.json or place Songs and Characters beside the EXE.\n'
              'F11: fullscreen, F3: diagnostics, Esc: back/quit.\n',
              encoding='utf-8'
          )
          '@ | Set-Content -Encoding utf8 reconstruct.py
          python reconstruct.py

      - name: Configure Release
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64 `
            -DBUILD_TESTING=OFF `
            -DSDL_TEST=OFF `
            -DSDL_TESTS=OFF `
            -DSDLIMAGE_SAMPLES=OFF `
            -DSDLIMAGE_TESTS=OFF `
            -DSDL2IMAGE_SAMPLES=OFF `
            -DSDL2IMAGE_TESTS=OFF `
            -DSDLTTF_SAMPLES=OFF

      - name: Build Release
        shell: pwsh
        run: cmake --build native/build --config Release --parallel 2

      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File native/scripts/package.ps1

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path 'native/dist/PKE_Native_Prototype_0.1/PKE Native Prototype.exe')) { throw 'EXE missing from package' }
          $bad = Get-ChildItem 'native/dist/PKE_Native_Prototype_0.1' -Recurse | Where-Object { $_.Name -match 'WebView2|Chromium|chrome_elf|msedgewebview' }
          if ($bad) { throw 'Browser runtime unexpectedly present' }
          Get-FileHash 'native/dist/PKE_Native_Prototype_0.1/PKE Native Prototype.exe' -Algorithm SHA256
          Get-ChildItem 'native/dist/PKE_Native_Prototype_0.1' | Format-Table Name,Length

      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: PKE-Native-Prototype-0.1-Windows-x64
          path: native/dist/PKE_Native_Prototype_0.1.zip
          if-no-files-found: error
