name: Build PKE Native Windows

on:
  push:
    branches: [ main, feat/v114-block1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tracked native source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install offline-core build headers
        run: sudo apt-get update -qq && sudo apt-get install -y libboost-dev libicu-dev

      - name: Configure offline core
        run: cmake -S native -B native/build-offline -DPKE_NATIVE_OFFLINE_CORE=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build offline core
        run: cmake --build native/build-offline --parallel 2

      - name: Test offline core
        run: ctest --test-dir native/build-offline --output-on-failure

  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout tracked native source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure Release
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64 `
            -DBUILD_TESTING=ON `
            '-DCMAKE_CXX_FLAGS=/EHsc /DNOMINMAX' `
            -DSDL_TEST=OFF `
            -DSDL_TESTS=OFF `
            -DSDLIMAGE_SAMPLES=OFF `
            -DSDLIMAGE_TESTS=OFF `
            -DSDL2IMAGE_SAMPLES=OFF `
            -DSDL2IMAGE_TESTS=OFF `
            -DSDLTTF_SAMPLES=OFF

      - name: Build Release
        shell: pwsh
        run: cmake --build native/build --config Release --parallel 2

      - name: Stage test runtime libraries
        shell: pwsh
        run: |
          $testDir = (Resolve-Path 'native/build/Release').Path
          Get-ChildItem 'native/build' -Recurse -Filter *.dll |
            Where-Object { $_.DirectoryName -ne $testDir } |
            ForEach-Object { Copy-Item $_.FullName $testDir -Force }

      - name: Test Release before packaging
        shell: pwsh
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File native/scripts/package.ps1

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path 'native/dist/PKE_Native_Prototype_0.1/PKE Native Prototype.exe')) { throw 'EXE missing from package' }
          foreach ($script in @("cpu-timing.js", "title-system.js", "population-social-sessions.js", "boss-battle.js", "song-difficulty.js", "population-imports.js", "population.js", "chart-utils.js", "catalog-imports.js", "catalog.js", "practice-replay.js")) {
            if (-not (Test-Path "native/dist/PKE_Native_Prototype_0.1/compat/$script")) { throw "Compatibility script missing: $script" }
          }
          if ((Test-Path 'native/dist/PKE_Native_Prototype_0.1/tests') -or (Test-Path 'native/dist/PKE_Native_Prototype_0.1/reference')) { throw 'Test/reference sources unexpectedly packaged' }
          $bad = Get-ChildItem 'native/dist/PKE_Native_Prototype_0.1' -Recurse | Where-Object { $_.Name -match 'WebView2|Chromium|chrome_elf|msedgewebview' }
          if ($bad) { throw 'Browser runtime unexpectedly present' }
          Get-FileHash 'native/dist/PKE_Native_Prototype_0.1/PKE Native Prototype.exe' -Algorithm SHA256
          Get-ChildItem 'native/dist/PKE_Native_Prototype_0.1' | Format-Table Name,Length

      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: PKE-Native-Prototype-0.1-Windows-x64
          path: native/dist/PKE_Native_Prototype_0.1.zip
          if-no-files-found: error
